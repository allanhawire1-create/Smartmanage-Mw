<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmartManage MW</title><style>body{font-family:Arial;margin:0;background:#f4f6f9}.header{background:#0a1931;color:#fff;padding:15px;text-align:center}.card{background:#fff;margin:10px;padding:15px;border-radius:12px}.btn{width:100%;padding:12px;background:#0a1931;color:#fff;border:none;border-radius:8px;margin-top:10px}input{width:95%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px}.item{border-bottom:1px solid #eee;padding:8px 0;display:flex;justify-content:space-between}</style></head><body><div class="header"><h1>SmartManage MW</h1><p>Schools | Shops | Businesses - Malawi</p></div><div class="card"><h3>Total: <span id="total">MK 0</span></h3><p>Records: <span id="count">0</span></p></div><div class="card"><input id="name" placeholder="Student / Product Name"><input id="amount" type="number" placeholder="Amount MK"><input id="extra" placeholder="Class / Quantity"><button class="btn" onclick="add()">+ ADD RECORD</button></div><div class="card"><h3>Records</h3><div id="list">No records yet</div><button class="btn" style="background:#c00" onclick="clearAll()">Clear All</button></div><script>let r=JSON.parse(localStorage.getItem('sm')||'[]');function add(){let n=document.getElementById('name').value,a=document.getElementById('amount').value,e=document.getElementById('extra').value;if(!n||!a)return alert('Fill name & amount');r.push({n,a:parseInt(a),e});localStorage.setItem('sm',JSON.stringify(r));document.getElementById('name').value='';document.getElementById('amount').value='';document.getElementById('extra').value='';show();}function show(){let t=r.reduce((s,x)=>s+x.a,0);document.getElementById('total').innerText='MK '+t;document.getElementById('count').innerText=r.length;let h='';r.slice().reverse().forEach(x=>{h+=`<div class=item><span>${x.n} - ${x.e}</span><b>MK ${x.a}</b></div>`});document.getElementById('list').innerHTML=h||'No records yet';}function clearAll(){if(confirm('Delete all?')){r=[];localStorage.clear();show();}}show();</script></body></html>
